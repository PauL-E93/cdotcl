<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CDO Tutor Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/index.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container-fluid h-100">
    <div class="row h-100">

        <div class="col-md-6 left-panel-container">

            <img src="assist/operation.png" class="operations-img" alt="Math Symbols">
            <img src="assist/book.png" class="notebook-img" alt="Notebook and Pencil">
            <img src="assist/abc.png" class="abc-img" alt="ABC Blocks">

            <div class="main-content">
                <img src="assist/logo.png" class="logo" alt="CDO Tutor Logo">

                <h3 class="fw-bold">CDO TUTOR</h3>
                <p class="tagline mb-4">ALWAYS ON THE GO</p>

            </div>

        </div>

        <div class="col-md-6 d-flex justify-content-center align-items-center">
            <div class="card shadow login-card p-4">
                <h4 class="mb-3 border-bottom pb-2">SIGN UP</h4>

                <div class="mb-1">
                    <label class="form-label">First Name</label>
                    <input type="text" id="first_name" class="form-control" placeholder="Enter First Name">
                </div>  
                <div class="mb-3">
                    <label class="form-label">Middle Name</label>
                    <input type="text" id="middle_name" class="form-control" placeholder="Enter Middle Name">
                </div>
                <div class="mb-3">  
                    <label class="form-label">Last Name</label>
                    <input type="text" id="last_name" class="form-control" placeholder="Enter Last Name">
                </div>
                                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter Username">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter Password">
                </div>
                <button onclick="handleSignup()" id="btnSignup" class="btn btn-signin w-100 mb-3">SIGN UP</button>
                <div class="text-center">
                    <small>
                        Already have an account?
                        <a href="login.html">Login</a><br>
                        <a href="#">Forgot Password</a>
                    </small>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
