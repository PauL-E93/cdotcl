<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDO Enrollment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/design.css">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../../js/index.js?v=20260814-school-year-curriculum"></script>

</head>
<body>

    <header id="dynamic-header"></header>
    
<main class="main-content" data-report-card-view="gradebook">
        <div class="top-bar">
            <h1 class="page-title">Class</h1>

            <div class="d-flex gap-3">
                <div class="search-wrapper">
                    <input type="text" class="form-control shadow-sm" placeholder="Search..." id="search-input">
                    <i class="bi bi-search search-icon"></i>
                </div>  
                <button class="btn btn-add shadow-sm px-4" id="">
                     Add Class 
                </button>
            </div>
        </div>

                                <div class="filter-container shadow-sm mb-4">
            <div class="filter-heading d-flex align-items-center justify-content-between gap-3 flex-wrap">
                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <span class="filter-label">Filter by:</span>
                    <button type="button" class="btn btn-theme filter-toggle-btn d-md-none">
                        <i class="bi bi-funnel me-2"></i> Filter & Sort
                    </button>
                </div>
            </div>

            <div class="filter-panel d-flex flex-wrap align-items-center gap-3">
                <select id="class-status-filter" class="form-select w-auto border-secondary shadow-sm">
                    <option value="">All Status</option>
                </select>
                <select id="class-program-filter" class="form-select w-auto border-secondary shadow-sm">
                    <option value="">All Subject</option>
                </select>
                <input id="class-date-filter" type="date" class="form-control w-auto border-secondary shadow-sm">
            </div>
        </div>

        <div class="card main-card shadow-sm p-3">
            <div class="card-body">
                
                <h5 class="fw-bold mb-3 d-flex justify-content-between align-items-center">Class Summary <div class="position-relative">
                        <button class="btn btn-link text-secondary p-0" id="more_option">
                            <i class="fa-solid fa-bars fa-lg"></i>
                        </button>
                        <div id="more_option_dropdown" class="position-absolute bg-white end-0" style="top: 100%; z-index: 1050;"></div>
                    </div></h5>
                <div class="stats-grid">
                    <div class="card stat-card">
                        <div class="stat-info">
                            <h4 class="mb-0 fw-bold" id="total-classes-count"></h4>
                            <small class="text-muted">Total Classes</small>
                        </div>
                        <div class="stat-icon">
                            <i class="bi bi-journal-text fs-1 text-dark"></i>
                        </div>
                    </div>

                    <div class="card stat-card">
                        <div class="stat-info">
                            <h4 class="mb-0 fw-bold" id="total-sections-count"></h4>
                            <small class="text-muted">Total Sections</small>
                        </div>
                        <div class="stat-icon">
                            <i class="bi bi-star-fill fs-1 text-warning"></i>
                        </div>
                    </div>

                    <div class="card stat-card">
                        <div class="stat-info">
                            <h4 class="mb-0 fw-bold" id="total-centers-count"></h4>
                            <small class="text-muted">Total Centers</small>
                        </div>
                        <div class="stat-icon">
                            <i class="bi bi-clock-history fs-1 text-dark"></i>
                        </div>
                    </div>

                    <div class="card stat-card">
                        <div class="stat-info">
                            <h4 class="mb-0 fw-bold" id="total-categories-count"></h4>
                            <small class="text-muted">Total Categories</small>
                        </div>
                        <div class="stat-icon">
                            <i class="bi bi-tags-fill fs-1 text-dark"></i>
                        </div>
                        
                    </div>
                </div>

                <h6 class="fw-bold mb-3 fs-5 mt-4" id="tableTitle">Class List </h6>

                <div class="card content-panel">
                    <div class="table-responsive">
                        <table class="table table-custom table-hover">
                            <thead id="tableHead">
                            </thead>

                           <tbody id="classTableBody">
                                <tr>
                                    <td colspan="4" class="text-center text-muted">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>



            </div>
    </main>



</body>
</html>
