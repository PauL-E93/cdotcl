<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDO Enrollment</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <link rel="stylesheet" href="../../css/design.css">


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script type="module" src="../../js/index.js"></script>

</head>
<body>

    <header id="dynamic-header"></header>
    
<main class="main-content class-directory-page">
        <div class="class-directory-header">
            <div><h1 class="page-title">Branch Classes</h1><p>Manage your branch classes, sections and students.</p></div>
            <div class="class-directory-header-actions">
                <button class="btn btn-outline-primary shadow-sm px-4" id="btn-add-section" data-class-permission="manage_sections" type="button" disabled><i class="bi bi-plus-lg me-2"></i>Add Section</button>
                <button class="btn btn-add shadow-sm px-4" id="btn-add-class" data-class-permission="create" type="button"><i class="bi bi-plus-lg me-2"></i>Add Class</button>
            </div>
        </div>
        <section class="class-selector-row" aria-label="Class and section selection">
            <div class="selector-field"><label for="class-selector">Class</label><select id="class-selector" class="form-select"><option value="">Select class...</option></select></div>
            <div class="selector-field"><label for="section-selector">Section</label><select id="section-selector" class="form-select" disabled><option value="">Select a class first...</option></select></div>
        </section>
        <section id="selected-section-view" class="selected-section-view" aria-live="polite"><div class="class-empty-state"><i class="bi bi-journal-bookmark"></i><h2>Select a class and section</h2><p>Choose a class first, then select a section to view its students and details.</p></div></section>
        <table class="d-none"><thead id="tableHead"></thead><tbody id="classTableBody"></tbody></table>
        <!-- Legacy class summary retained below for compatibility with existing controls. -->
        <div class="d-none">
        <div class="top-bar">
            <h1 class="page-title">Class</h1>

            <div class="d-flex gap-3">
                <div class="search-wrapper">
                    <input type="text" class="form-control shadow-sm" placeholder="Search..." id="search-input">
                    <i class="bi bi-search search-icon"></i>
                </div>  
                <button class="btn btn-add shadow-sm px-4" id="">
                     Add Class 
                </button>
            </div>
        </div>

                                <div class="filter-container shadow-sm mb-4">
            <div class="filter-heading d-flex align-items-center justify-content-between gap-3 flex-wrap">
                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <span class="filter-label">Filter by:</span>
                    <button type="button" class="btn btn-theme filter-toggle-btn d-md-none">
                        <i class="bi bi-funnel me-2"></i> Filter & Sort
                    </button>
                </div>
            </div>

            <div class="filter-panel d-flex flex-wrap align-items-center gap-3">
                <select class="form-select w-auto border-secondary shadow-sm">
                    <option>All Status</option>
                    <option>Active</option>
                    <option>Pending</option>
                    <option>Cancelled</option>
                </select>
                <select class="form-select w-auto border-secondary shadow-sm">
                    <option>All Subject</option>
                    <option>Math</option>
                    <option>Science</option>
                    <option>English</option>
                </select>
                <input type="date" class="form-control w-auto border-secondary shadow-sm">
            </div>
        </div>

        <div class="card main-card shadow-sm p-3">
            <div class="card-body">
                
                <h5 class="fw-bold mb-3 d-flex justify-content-between align-items-center">Class Summary <div class="position-relative">
                        <button class="btn btn-link text-secondary p-0" id="more_option">
                            <i class="fa-solid fa-bars fa-lg"></i>
                        </button>
                        <div id="more_option_dropdown" class="position-absolute bg-white end-0" style="top: 100%; z-index: 1050;"></div>
                    </div></h5>
                <div class="stats-grid">
                    <div class="card stat-card">
                        <div class="stat-info">
                            <h4 class="mb-0 fw-bold" id="total-classes-count"></h4>
                            <small class="text-muted">Branch Classes</small>
                        </div>
                        <div class="stat-icon">
                            <i class="bi bi-journal-text fs-1 text-dark"></i>
                        </div>
                    </div>

                    <div class="card stat-card">
                        <div class="stat-info">
                            <h4 class="mb-0 fw-bold" id="total-sections-count"></h4>
                            <small class="text-muted">Branch Sections</small>
                        </div>
                        <div class="stat-icon">
                            <i class="bi bi-star-fill fs-1 text-warning"></i>
                        </div>
                    </div>

                    <div class="card stat-card">
                        <div class="stat-info">
                            <h4 class="mb-0 fw-bold" id="total-centers-count"></h4>
                            <small class="text-muted">Students</small>
                        </div>
                        <div class="stat-icon">
                            <i class="bi bi-clock-history fs-1 text-dark"></i>
                        </div>
                    </div>

                    <div class="card stat-card">
                        <div class="stat-info">
                            <h4 class="mb-0 fw-bold" id="total-categories-count"></h4>
                            <small class="text-muted">Branches</small>
                        </div>
                        <div class="stat-icon">
                            <i class="bi bi-tags-fill fs-1 text-dark"></i>
                        </div>
                        
                    </div>
                </div>

                <h6 class="fw-bold mb-3 fs-5 mt-4" id="tableTitle">Class List </h6>

                <div class="card content-panel">
                    <div class="table-responsive">
                        <table class="table table-custom table-hover">
                            <thead id="tableHead">
                            </thead>

                           <tbody id="classTableBody">
                                <tr>
                                    <td colspan="4" class="text-center text-muted">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>



            </div>
    </main>

        <div class="modal-dialog modal-lg">

                <div class="modal-header">
                    <h5 class="modal-title" id="addEnrollmentModalLabel">Add New Enrollment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addEnrollmentForm">

                <div class="modal-footer">

                </div>
            </div>
        </div>
    </div> -->

</body>
</html>
