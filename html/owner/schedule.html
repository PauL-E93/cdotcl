<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Schedule</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/design.css?v=20260828-five-schedule-rows">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../../js/index.js?v=20260828-five-schedule-rows"></script>
</head>
<body>
    <header id="dynamic-header"></header>

    <main class="main-content">
        <div class="top-bar">
            <h1 class="page-title">SCHEDULE</h1>

            <div class="d-flex gap-3">
                <div class="search-wrapper">
                    <input type="text" class="form-control shadow-sm" placeholder="Search..." id="search-input">
                    <i class="bi bi-search search-icon"></i>
                </div>
            </div>
        </div>

        <div class="filter-container owner-schedule-filter shadow-sm mb-4">
            <div class="filter-heading owner-schedule-filter-row">
                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <span class="filter-label">Filter by:</span>
                    <button type="button" class="btn btn-theme filter-toggle-btn d-md-none">
                        <i class="bi bi-funnel me-2"></i> Filter & Sort
                    </button>
                </div>

                <div class="filter-panel owner-schedule-filter-panel align-items-center">
                    <select class="form-select" id="owner-schedule-branch-filter" aria-label="Filter schedule by center">
                        <option value="all">All Centers</option>
                    </select>
                    <select class="form-select" id="owner-schedule-status-filter" aria-label="Filter schedule by status">
                        <option value="all">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="ongoing">Ongoing</option>
                        <option value="done">Done</option>
                        <option value="cancelled">Cancelled</option>
                        <option value="no-show">No-show</option>
                    </select>
                </div>


            </div>
        </div>

        <div id="calendar-container" class="module-container"></div>
    </main>

    <script type="module">
        import OwnerCalendarModule from '../../js/modules/owner_schedule.js?v=20260828-five-schedule-rows';
        document.addEventListener('DOMContentLoaded', () => {
            if (window.__scheduleRbacLocked) return;
            new OwnerCalendarModule('calendar-container');
        });
    </script>
</body>
</html>
