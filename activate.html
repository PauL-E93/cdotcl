<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activate account | CDO Tutor</title><link rel="stylesheet" href="css/login.css"></head>
<body class="login-page"><main class="login-shell"><section class="login-form-panel">
<div class="login-card"><h1>Activate your account</h1><p>Choose a password of at least 12 characters with an uppercase letter, number, and symbol. This link can be used once and expires after 24 hours.</p>
<form id="activation-form"><div class="login-field"><label for="password">New password</label><input class="form-control" id="password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></div>
<div class="login-field"><label for="confirm-password">Confirm password</label><input class="form-control" id="confirm-password" type="password" minlength="12" maxlength="72" autocomplete="new-password" required></div>
<button class="btn btn-signin" type="submit">Activate account</button></form><p id="status" role="status"></p><a href="login.html">Back to login</a></div></section></main>
<script src="js/activate.js" defer></script></body></html>
