<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CDO Tutor Password Reset</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="module" src="js/index.js"></script>
    <script type="module" src="js/utilities/forgetpassword.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container-fluid h-100">
    <div class="row h-100">

        <div class="col-md-6 left-panel-container">
            <img src="assist/operation.png" class="operations-img" alt="Math Symbols">
            <img src="assist/book.png" class="notebook-img" alt="Notebook and Pencil">
            <img src="assist/abc.png" class="abc-img" alt="ABC Blocks">

            <div class="main-content">
                <img src="assist/logo.png" class="logo" alt="CDO Tutor Logo">
                <h3 class="fw-bold">CDO TUTOR</h3>
                <p class="tagline mb-4">ALWAYS ON THE GO</p>
            </div>
        </div>

        <div class="col-md-6 d-flex justify-content-center align-items-center">
            <div class="card shadow login-card p-4" style="min-width: 320px; max-width: 420px; width: 100%;">
                <h4 class="mb-3 border-bottom pb-2">FORGOT PASSWORD</h4>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="resetEmail" class="form-control" placeholder="Enter your email" required>
                </div>

                <div id="otpSection" class="mb-3 d-none">
                    <label class="form-label">OTP Code</label>
                    <input type="text" id="resetOtp" class="form-control" placeholder="Enter the OTP sent to email">
                </div>

                <div id="timerSection" class="mb-3 d-none">
                    <small class="text-muted">OTP expires in <span id="otpCountdown">10:00</span></small>
                </div>

                <button id="resendOtpButton" class="btn btn-secondary w-100 mb-3 d-none">RESEND OTP</button>

                <div id="passwordSection" class="d-none">
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" id="resetPassword" class="form-control" placeholder="Enter new password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" id="resetConfirmPassword" class="form-control" placeholder="Confirm new password">
                    </div>
                </div>

                <button id="sendOtpButton" class="btn btn-signin w-100 mb-3">SEND OTP</button>
                <button id="verifyOtpButton" class="btn btn-signin w-100 mb-3 d-none">VERIFY OTP</button>
                <button id="resetPasswordButton" class="btn btn-signin w-100 mb-3 d-none">RESET PASSWORD</button>

                <div class="text-center">
                    <small>
                        Remembered your password?
                        <a href="login.html">Log in</a><br>
                        Don’t have an account?
                        <a href="signup.html">Sign up</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
