<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDO Enrollment</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">  
    <link rel="stylesheet" href="../../css/design.css?v=20260828-five-schedule-rows">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../../js/index.js?v=20260828-five-schedule-rows"></script>

</head>
<body>

  <header id="dynamic-header"></header>
    
    <main class="main-content">
        <div class="top-bar">
            <h1 class="page-title">Schedule</h1>

            <div class="d-flex gap-3">
                <div class="search-wrapper">
                    <input type="text" class="form-control shadow-sm" placeholder="Search student name or ID..." id="search-input">
                    <i class="bi bi-search search-icon"></i>
                </div>  
            </div>
        </div>

<div class="filter-container shadow-sm mb-4">
            <div class="filter-heading d-flex align-items-center justify-content-between gap-3 flex-wrap">
                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <span class="filter-label">Filter by:</span>
                    <button type="button" class="btn btn-theme filter-toggle-btn d-md-none">
                        <i class="bi bi-funnel me-2"></i> Filter & Sort
                    </button>
                </div>
                <div class="d-flex gap-2 filter-actions">
                    <button class="btn btn-theme apply-filters-btn" type="button">Apply Filters</button>
                    <button class="btn btn-outline-dark rounded-circle filter-settings-btn" type="button"><i class="bi bi-gear"></i></button>
                </div>
            </div>

            <div class="filter-panel d-flex flex-wrap align-items-center gap-3">
                <select class="form-select w-auto border-secondary shadow-sm" id="teacher-schedule-status-filter" aria-label="Filter schedule by status">
                    <option value="all">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="ongoing">Ongoing</option>
                    <option value="done">Done</option>
                    <option value="cancelled">Cancelled</option>
                    <option value="no-show">No-show</option>
                </select>
            </div>
        </div>
        <div id="calendar-container" class="module-container"></div>
    </main>

    <!-- Add Enrollment Modal -->
    <div class="modal fade" id="addEnrollmentModal" tabindex="-1" aria-labelledby="addEnrollmentModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addEnrollmentModalLabel">Add New Enrollment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addEnrollmentForm">
                        <!-- Form fields will be generated dynamically -->
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="saveEnrollment">Save Student</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Enrollment Details Modal -->
    <div class="modal fade" id="enrollmentDetailsModal" tabindex="-1" aria-labelledby="enrollmentDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="enrollmentDetailsModalLabel">Enrollment Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="enrollmentForm">
                        <!-- Form fields will be generated dynamically -->
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="finalizeEnrollment">Finalize Enrollment</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import TeacherCalendarModule from '../../js/modules/schedule.js?v=20260828-five-schedule-rows';
        document.addEventListener('DOMContentLoaded', () => {
            if (window.__scheduleRbacLocked) return;
            new TeacherCalendarModule('calendar-container');
        });
    </script>

</body>
</html>
