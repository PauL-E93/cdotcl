<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CDO Enrollment</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <link rel="stylesheet" href="../../css/design.css">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script type="module" src="../../js/index.js"></script>

    </head>
    <body>

        <header id="dynamic-header"></header>
        
    <main class="main-content">
            <div class="top-bar">
                <h1 class="page-title">DISCOUNT</h1>

                <div class="d-flex gap-3">
                    <div class="search-wrapper">
                        <input type="text" class="form-control shadow-sm" placeholder="Search..." id="search-input">
                        <i class="bi bi-search search-icon"></i>
                    </div>  
                    <button class="btn btn-add shadow-sm px-4" data-bs-toggle="modal" data-bs-target="#addDiscountModal">
                        <i class="bi bi-plus-lg"></i> Add DISCOUNT
                    </button>
                </div>
            </div>

                                    <div class="filter-container shadow-sm mb-4">
            <div class="filter-heading d-flex align-items-center justify-content-between gap-3 flex-wrap">
                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <span class="filter-label">Filter by:</span>
                    <button type="button" class="btn btn-theme filter-toggle-btn d-md-none">
                        <i class="bi bi-funnel me-2"></i> Filter & Sort
                    </button>
                </div>
                <div class="d-flex gap-2 filter-actions">
                    <button class="btn btn-theme">Apply Filters</button>
                    <button class="btn btn-outline-dark rounded-circle"><i class="bi bi-gear"></i></button>
                </div>
            </div>

            <div class="filter-panel d-flex flex-wrap align-items-center gap-3">
                <select class="form-select w-auto border-secondary shadow-sm">
                    <option>All Status</option>
                    <option>Active</option>
                    <option>Pending</option>
                    <option>Cancelled</option>
                </select>
                <select class="form-select w-auto border-secondary shadow-sm">
                    <option>All Subject</option>
                    <option>Math</option>
                    <option>Science</option>
                    <option>English</option>
                </select>
                <input type="date" class="form-control w-auto border-secondary shadow-sm">
            </div>
        </div>
            <div class="card main-card shadow-sm p-3">
        <div class="card-body">
            
            <h5 class="fw-bold mb-3">DISCOUNT</h5>
            <div class="stats-grid">
                <div class="card stat-card">
                    <div class="stat-info">
                        <h4 class="mb-0 fw-bold" id="total_discounts">0</h4> <small class="text-muted">Total Discounts</small>
                    </div>
                    <div class="stat-icon">
                        <i class="bi bi-percent fs-1 text-dark"></i>
                    </div>
                </div>

                <div class="card stat-card">
                    <div class="stat-info">
                        <h4 class="mb-0 fw-bold" id="active_discounts">0</h4> <small class="text-muted">Active Discounts</small>
                    </div>
                    <div class="stat-icon">
                        <i class="bi bi-check-circle-fill fs-1 text-success"></i>
                    </div>
                </div>


                <div class="card stat-card">
                    <div class="stat-info">
                        <h4 class="mb-0 fw-bold" id="inactive_discounts">0</h4> <small class="text-muted">Inactive Discounts</small>
                    </div>
                    <div class="stat-icon">
                        <i class="bi bi-x-circle-fill fs-1 text-danger"></i>
                    </div>
                </div>
            </div>

            <h6 class="fw-bold mb-3 fs-5">discount list</h6>
            <div class="card content-panel">
                <div class="table-responsive">
                    <table class="table table-custom table-hover">
                        <thead>
                            <tr>
                                <th style="background-color:#ea9aa6;">Name </th>
                                <th style="background-color:#ea9aa6;">Description</th>
                                <th style="background-color:#ea9aa6;">Percentage</th>
                                <th style="background-color:#ea9aa6;">Status</th>
                                <th style="background-color:#ea9aa6;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="discount_table_body"> <tr><td colspan="5" class="text-center">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <small class="text-muted">Showing recent entries</small>
                    <nav>
                        <ul class="pagination mb-0">
                            <li class="page-item"><a class="page-link btn-theme border-0 rounded-start">Previous</a></li>
                            <li class="page-item active"><a class="page-link border-0">1</a></li>
                            <li class="page-item"><a class="page-link border-0 text-dark">Next</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
        </main>
<div class="modal fade" id="addDiscountModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="dynamicModalLabel">Modal Title</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-body">
                <form id="dynamicForm"></form>
            </div>
            
            <div class="modal-footer" id="dynamicModalFooter">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
        </div>
    </div>
</div>
        

    </body>
    </html>
