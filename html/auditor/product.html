<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDO Enrollment - Product Management</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="../../css/design.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script type="module" src="../../js/index.js"></script>
</head>
<body>

    <header id="dynamic-header"></header>
    
    <main class="main-content">
        <div class="top-bar">
            <h1 class="page-title">PRODUCT</h1>
            <div class="d-flex gap-3">
                <div class="search-wrapper">
                    <input type="text" class="form-control shadow-sm" placeholder="Search..." id="search-input">
                    <i class="bi bi-search search-icon"></i>
                </div>  
            </div>
        </div>
        <div class="card main-card shadow-sm p-3">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Product Summary</h5>
                    <div class="position-relative">
                        <button class="btn btn-link text-secondary p-0" id="more_option">
                            <i class="fa-solid fa-bars fa-lg"></i>
                        </button>
                        <div id="more_option_dropdown" class="position-absolute bg-white end-0" style="top: 100%; z-index: 1050;"></div>
                    </div>
                </div>

                <div class="stats-grid mb-4">
                    <div class="card stat-card">
                        <div class="stat-info">
                            <h4 class="mb-0 fw-bold" id="total-products-count">0</h4>
                            <small class="text-muted">Total Products</small>
                        </div>
                        <div class="stat-icon"><i class="bi bi-box-seam fs-1 text-primary"></i></div>
                    </div>
                    </div>

                <h6 class="fw-bold mb-3 fs-5 mt-4">Product List</h6>
                
                <div class="card content-panel">
                    <div class="table-responsive">
                        <table class="table table-custom table-hover align-middle">
                            <thead>
                                <tr>
                                    <th style="background-color:#ea9aa6;">Product Name</th>
                                    <th style="background-color:#ea9aa6;">Category</th>
                                    <th style="background-color:#ea9aa6;">Stock Level</th>
                                    <th style="background-color:#ea9aa6;">Price</th>
                                    <th style="background-color:#ea9aa6;">Status</th>
                                    <th style="background-color:#ea9aa6;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productTableBody">
                                <tr>
                                    <td colspan="6" class="text-center text-muted">Loading products...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    </body>
</html>
