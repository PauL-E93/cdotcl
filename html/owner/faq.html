<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../../js/utilities/upload_url.js?v=20261006-upload-images-r2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage FAQs | CDO Tutor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/design.css?v=20261016-sidebar-scroll">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js?v=20261006-upload-images"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js?v=20261006-upload-images"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../../js/index.js?v=20261012-all-user-session"></script>
</head>
<body>
    <header id="dynamic-header"></header>
    <main class="main-content">
        <div class="top-bar">
            <div><h1 class="page-title mb-1">FREQUENTLY ASKED QUESTIONS</h1><p class="text-muted mb-0">Manage the questions displayed on the public landing page.</p></div>
        </div>
        <section class="card content-panel shadow-sm p-3 mb-4" data-program-feature="landing">
            <div class="d-flex justify-content-between align-items-center mb-3 gap-3 flex-wrap">
                <div><h5 class="fw-bold mb-1">FAQ List</h5><small class="text-muted">Use the display order to control the order shown to visitors.</small></div>
                <button type="button" class="btn btn-sm btn-add shadow-sm px-3" id="btnAddFaq"><i class="bi bi-plus-lg me-1"></i>Add FAQ</button>
            </div>
            <div class="table-responsive">
                <table class="table table-custom table-hover align-middle">
                    <thead><tr><th style="background-color:#ea9aa6;">Question</th><th style="background-color:#ea9aa6;">Answer</th><th style="background-color:#ea9aa6;">Order</th><th style="background-color:#ea9aa6;">Status</th><th style="background-color:#ea9aa6;" class="text-center">Actions</th></tr></thead>
                    <tbody id="faq_table_body"><tr><td colspan="5" class="text-center">Loading data...</td></tr></tbody>
                </table>
            </div>
        </section>
    </main>
    <div class="modal fade" id="faqModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title" id="faqModalLabel">Add FAQ</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><form id="faqForm"><div class="modal-body"><div class="mb-3"><label class="form-label" for="faqQuestion">Question <span class="text-danger">*</span></label><input class="form-control" id="faqQuestion" maxlength="500" required></div><div class="mb-3"><label class="form-label" for="faqAnswer">Answer <span class="text-danger">*</span></label><textarea class="form-control" id="faqAnswer" rows="6" required></textarea></div><div class="row g-3"><div class="col-md-6"><label class="form-label" for="faqDisplayOrder">Display Order</label><input class="form-control" id="faqDisplayOrder" type="number" min="0" value="0"></div><div class="col-md-6"><label class="form-label" for="faqStatus">Status</label><select class="form-select" id="faqStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-add">Save FAQ</button></div></form></div></div>
    </div>
</body>
</html>
