<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDO Enrollment</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">  
    <link rel="stylesheet" href="../../css/design.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../../js/index.js"></script>
    <script type="module" src="../../js/studentmodule/CalendarModule.js"></script>

</head>
<body>

  <header id="dynamic-header"></header>
    
    <main class="main-content">
        <div class="top-bar">
            <h1 class="page-title">Schedule</h1>

            <div class="d-flex gap-3">
                <div class="search-wrapper">
                    <input type="text" class="form-control shadow-sm" placeholder="Search subject or teacher..." id="search-input">
                    <i class="bi bi-search search-icon"></i>
                </div>  
            </div>
        </div>

<div class="filter-container shadow-sm mb-4">
            <div class="filter-heading d-flex align-items-center justify-content-between gap-3 flex-wrap">
                <div class="d-flex align-items-center gap-3 flex-wrap">
                    <span class="filter-label">Filter by:</span>
                    <button type="button" class="btn btn-theme filter-toggle-btn d-md-none">
                        <i class="bi bi-funnel me-2"></i> Filter & Sort
                    </button>
                </div>
                <div class="d-flex gap-2 filter-actions">
                    <button class="btn btn-theme" id="schedule-apply-filters">Apply Filters</button>
                </div>
            </div>

            <div class="filter-panel d-flex flex-wrap align-items-center gap-3">
                <select class="form-select w-auto border-secondary shadow-sm" id="schedule-status-filter">
                    <option value="">All Status</option>
                </select>
                <select class="form-select w-auto border-secondary shadow-sm" id="schedule-subject-filter">
                    <option value="">All Subjects</option>
                </select>
                <select class="form-select w-auto border-secondary shadow-sm" id="schedule-teacher-filter">
                    <option value="">All Teachers</option>
                </select>
                <select class="form-select w-auto border-secondary shadow-sm" id="schedule-type-filter">
                    <option value="">All Enrollment Types</option>
                    <option value="Tutorial">Tutorial</option>
                    <option value="Preschool">Preschool</option>
                    <option value="Play School">Play School</option>
                </select>
            </div>
        </div>

        <div class="schedule-type-legend" aria-label="Schedule color legend">
            <span><i class="schedule-legend-swatch schedule-legend-tutorial"></i>Tutorial</span>
            <span><i class="schedule-legend-swatch schedule-legend-preplay"></i>Preschool / Play School</span>
        </div>

        <div id="calendar-module-root" class="module-container"></div>

    </main>

    <div class="modal fade" id="addEnrollmentModal" tabindex="-1" aria-labelledby="addEnrollmentModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addEnrollmentModalLabel">Add New Enrollment</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="addEnrollmentForm">
                        </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="saveEnrollment">Save Student</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="enrollmentDetailsModal" tabindex="-1" aria-labelledby="enrollmentDetailsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="enrollmentDetailsModalLabel">Enrollment Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="enrollmentForm">
                        </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="finalizeEnrollment">Finalize Enrollment</button>
                </div>
            </div>
        </div>
    </div>



</body>
</html>
