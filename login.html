<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDO Tutor Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="js/index.js?v=20260809-captcha-expiry"></script>
    <link rel="stylesheet" href="css/style.css?v=20260828-login-home-button">
</head>
<body class="login-page">
    <div class="container-fluid h-100">
        <div class="row h-100">
            <div class="col-md-6 left-panel-container">
                <img src="assist/operation.png" class="operations-img" alt="Math Symbols">
                <img src="assist/book.png" class="notebook-img" alt="Notebook and Pencil">
                <img src="assist/abc.png" class="abc-img" alt="ABC Blocks">

                <div class="main-content">
                    <img src="assist/logo.png" class="logo" alt="CDO Tutor Logo">
                    <h3 class="fw-bold">CDO TUTOR</h3>
                    <p class="tagline mb-4">ALWAYS ON THE GO</p>
                </div>
            </div>

            <div class="col-md-6 login-form-panel d-flex justify-content-center align-items-center">
                <div class="card shadow login-card p-4">
                    <h4 class="mb-2">Welcome back!</h4>
                    <p class="login-card__subtitle">Log in to continue your learning journey.</p>

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="login-input-wrapper">
                            <i class="fa-regular fa-user login-input-icon" aria-hidden="true"></i>
                            <input type="text" id="username" class="form-control" placeholder="Enter username">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="password-input-wrapper login-input-wrapper">
                            <i class="fa-solid fa-lock login-input-icon" aria-hidden="true"></i>
                            <input type="password" id="password" class="form-control pe-5" placeholder="Enter password">
                            <button type="button" id="toggle-password" class="password-toggle" aria-label="Show password" aria-pressed="false">
                                <i class="fa-solid fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="captcha-answer" class="form-label">Solve to continue</label>
                        <div class="math-captcha" aria-label="Solve the math CAPTCHA">
                            <span id="captcha-first-number" class="captcha-number">--</span>
                            <span class="captcha-symbol">+</span>
                            <span id="captcha-second-number" class="captcha-number">--</span>
                            <span class="captcha-symbol">=</span>
                            <input type="number" id="captcha-answer" class="form-control captcha-answer" inputmode="numeric" autocomplete="off" aria-label="Math CAPTCHA answer">
                            <button type="button" id="refresh-captcha" class="captcha-refresh" aria-label="Generate a new math CAPTCHA">
                                <i class="fa-solid fa-arrows-rotate" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <button onclick="handleLogin()" class="btn btn-signin w-100 mb-3">LOG IN</button>

                    <a href="index.html" class="btn login-home-button w-100 mb-3">
                        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                        BACK TO HOME
                    </a>

                    <div class="text-center">
                        <small>
                            <a class="forgot-password-link" href="forgetpassword.html">Forgot Password</a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
