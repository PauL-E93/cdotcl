<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../../js/utilities/upload_url.js?v=20261006-upload-images-r2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/design.css">
    <link rel="stylesheet" href="../../css/notification_history.css?v=20260921">
    <script type="module" src="../../js/index.js?v=20261012-all-user-session"></script>
    <script type="module" src="../../js/modules/notification_history.js?v=20261006-upload-images"></script>
</head>
<body>
    <header id="dynamic-header"></header>

    <main class="main-content notification-history-page">
        <section class="notification-history-hero">
            <div>
                <span class="notification-history-eyebrow">Account activity</span>
                <h1>Notification History</h1>
                <p>Review every notification, including items dismissed from the header.</p>
            </div>
            <div class="notification-history-summary" aria-label="Notification summary">
                <div><strong id="history-total-count">0</strong><span>Total</span></div>
                <div><strong id="history-unread-count">0</strong><span>Unread</span></div>
                <div><strong id="history-archived-count">0</strong><span>Dismissed</span></div>
            </div>
        </section>

        <section class="notification-history-panel">
            <div class="notification-history-toolbar">
                <label class="notification-history-search" for="notification-history-search">
                    <i class="bi bi-search" aria-hidden="true"></i>
                    <input id="notification-history-search" type="search" placeholder="Search notifications" autocomplete="off">
                </label>
                <button type="button" class="notification-history-mark-all" id="notification-history-mark-all">
                    <i class="bi bi-check2-all" aria-hidden="true"></i> Mark all as read
                </button>
            </div>

            <div class="notification-history-filters" role="group" aria-label="Filter notifications">
                <button type="button" class="active" data-notification-filter="all">All</button>
                <button type="button" data-notification-filter="unread">Unread</button>
                <button type="button" data-notification-filter="read">Read</button>
                <button type="button" data-notification-filter="dismissed">Dismissed</button>
            </div>

            <div id="notification-history-status" class="notification-history-status" role="status">Loading notifications…</div>
            <div id="notification-history-list" class="notification-history-list" hidden></div>
        </section>
    </main>
</body>
</html>
